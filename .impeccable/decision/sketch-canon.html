<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brief straight sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--forest:#1F3A2E;--champ:#C9A96E;--ivory:#F5F1EB;--esp:#3B2A20}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ivory);font-family:Jost,sans-serif;color:var(--esp)}
.hero{position:relative;height:844px;background:#2a2622 url(../../public/products/city-leather-backpack-worn.jpg) center/cover}
.hero:after{content:"";position:absolute;inset:0;background:rgba(31,58,46,.35)}
header{position:absolute;top:0;left:0;right:0;z-index:2;height:64px;display:flex;align-items:center;justify-content:center;color:var(--ivory)}
.wm{text-align:center;font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:.28em;font-size:24px;line-height:1}
.wm small{display:block;font-family:Jost;font-size:8px;letter-spacing:.5em;margin-top:4px}
.c{position:absolute;z-index:1;left:0;right:0;top:50%;transform:translateY(-30%);text-align:center;color:var(--ivory);padding:0 24px}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:48px;line-height:1.05;text-transform:uppercase;letter-spacing:.08em}
.c p{font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-top:14px}
.btn{display:inline-block;margin-top:26px;border:1px solid var(--ivory);color:var(--ivory);font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding:15px 26px}
</style></head><body>
<section class="hero"><header><div class="wm">VÉRANE<small>PARIS</small></div></header>
<div class="c"><h1>Véritablement vôtre</h1><p>Truly yours</p><a class="btn">Discover the collection</a></div></section>
</body></html>
