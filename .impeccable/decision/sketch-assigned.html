<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swatch Book sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--forest:#1F3A2E;--champ:#C9A96E;--ivory:#F5F1EB;--esp:#3B2A20;--ivd:#ECE5DA}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ivory);color:var(--esp);font-family:Jost,sans-serif}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:absolute;top:0;left:0;right:0;z-index:2;color:var(--ivory)}
.wm{text-align:center;font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:.28em;font-size:24px;line-height:1}
.wm small{display:block;font-family:Jost;font-size:8px;letter-spacing:.5em;color:var(--champ);margin-top:4px}
.ic{width:22px;height:1px;background:currentColor;box-shadow:0 6px 0 currentColor,0 -6px 0 currentColor}
.hero{position:relative;height:640px;background:#2a2622 url(../../public/products/city-leather-backpack-worn.jpg) center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(31,58,46,.78),rgba(31,58,46,0) 55%)}
.copy{position:absolute;left:22px;right:22px;bottom:150px;z-index:1;color:var(--ivory)}
.ref{font-size:10px;letter-spacing:.32em;color:var(--champ);text-transform:uppercase}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-style:italic;font-size:52px;line-height:1;margin-top:10px}
.btn{display:inline-block;margin-top:20px;background:var(--ivory);color:var(--forest);font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding:15px 26px}
.chips{position:absolute;left:0;right:0;bottom:0;z-index:1;background:var(--ivory);padding:18px 22px 20px;border-top:1px solid var(--champ)}
.chips p{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#6E5F54}
.row{display:flex;gap:12px;margin-top:12px}
.chip{width:72px}
.sw{height:54px;border-radius:2px}
.chip span{display:block;font-family:'Cormorant Garamond',serif;font-size:15px;margin-top:6px}
.chip em{display:block;font-style:normal;font-size:9px;letter-spacing:.2em;color:#6E5F54}
.below{padding:26px 22px}
.below h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:34px;line-height:1.05}
</style></head><body>
<header><div class="ic"></div><div class="wm">VÉRANE<small>PARIS</small></div><div style="font-size:11px;letter-spacing:.2em">BAG 0</div></header>
<section class="hero">
  <div class="copy"><p class="ref">Genuine leather · Designed in Paris</p><h1>Véritablement vôtre</h1><a class="btn">Discover the collection</a></div>
  <div class="chips"><p>The colours · tap a leather</p>
    <div class="row">
      <div class="chip"><div class="sw" style="background:#1d1a18"></div><span>Noir</span><em>RÉF. 021</em></div>
      <div class="chip"><div class="sw" style="background:#8a4a22"></div><span>Cognac</span><em>RÉF. 034</em></div>
      <div class="chip"><div class="sw" style="background:#5e1f24"></div><span>Bordeaux</span><em>RÉF. 047</em></div>
      <div class="chip"><div class="sw" style="background:#e9dfcf;outline:1px solid #DDD3C4"></div><span>Crème</span><em>RÉF. 052</em></div>
    </div></div>
</section>
<section class="below"><p class="ref" style="color:#8A6A36">Vérane · from véritable</p><h2>Genuine, in every sense of the word.</h2></section>
</body></html>
