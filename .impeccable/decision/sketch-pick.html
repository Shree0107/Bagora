<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rue Vitrine sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--forest:#1F3A2E;--champ:#C9A96E;--ivory:#F5F1EB;--esp:#3B2A20}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--forest);color:var(--ivory);font-family:Jost,sans-serif}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.ic{width:22px;height:1px;background:var(--champ);box-shadow:0 6px 0 var(--champ),0 -6px 0 var(--champ)}
.sign{margin:6px 18px 0;border-top:1px solid var(--champ);border-bottom:1px solid var(--champ);padding:16px 0 12px;text-align:center}
.sign b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:44px;letter-spacing:.3em;color:var(--champ);line-height:1}
.sign small{display:block;font-size:9px;letter-spacing:.6em;color:var(--champ);margin-top:8px}
.window{margin:16px 18px 0;height:560px;border:10px solid #193024;outline:1px solid var(--champ);position:relative;background:#2a2622 url(../../public/products/city-leather-backpack.jpg) center/cover}
.mull{position:absolute;top:0;bottom:0;left:50%;width:6px;background:#193024;opacity:.0}
.glass{position:absolute;left:0;right:0;bottom:0;padding:22px;background:linear-gradient(to top,rgba(22,41,31,.85),rgba(22,41,31,0))}
.glass p{font-size:10px;letter-spacing:.32em;color:var(--champ);text-transform:uppercase}
h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:46px;line-height:1;color:var(--champ);margin-top:8px}
.btn{display:inline-block;margin-top:16px;border:1px solid var(--champ);color:var(--ivory);font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding:14px 22px}
.sill{margin:0 18px;height:14px;background:#16291F;border-bottom:1px solid var(--champ)}
.door{text-align:center;font-size:10px;letter-spacing:.4em;color:var(--champ);margin-top:22px}
</style></head><body>
<header><div class="ic"></div><div style="font-size:11px;letter-spacing:.2em;color:var(--champ)">BAG 0</div></header>
<div class="sign"><b>VÉRANE</b><small>MAISON · PARIS</small></div>
<div class="window"><div class="glass"><p>Genuine leather · Designed in Paris</p><h1>Véritablement vôtre</h1><a class="btn">Step inside · the collection</a></div></div>
<div class="sill"></div>
<p class="door">TOTE · CROSSBODY · SHOULDER · WORK</p>
</body></html>
